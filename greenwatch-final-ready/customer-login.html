<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Login — GreenWatch</title><link rel="stylesheet" href="css/style.css"></head><body><div class="container" style="max-width:460px;padding-top:80px"><div class="panel"><div class="brand"><div class="brandmark">G</div>GreenWatch</div><h2>Customer Login</h2><p class="muted small">Masuk memakai email dan access code yang diberikan admin.</p><form id="customerLoginForm"><div class="field" style="display:block"><input id="loginEmail" type="email" placeholder="Email" required style="width:100%"></div><div class="field" style="display:block"><input id="loginCode" type="password" placeholder="Access code" required style="width:100%"></div><button class="btn block" type="submit">Login</button></form><p id="loginMsg" class="danger small"></p><div class="notice">Access code asli tidak disimpan di Google Sheets; backend menyimpan hash SHA-256.</div></div></div><script src="js/config.js"></script><script src="js/customer-login.js"></script></body></html>
