<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — GreenWatch</title><link rel="stylesheet" href="css/admin.css"></head>
<body class="login"><div class="loginbox"><div class="brand"><div class="logo">G</div>GreenWatch Database Admin</div>
<h2>Admin access</h2><p class="muted small">Masukkan admin key yang sama dengan Script Property <b>ADMIN_KEY</b> di Apps Script.</p>
<div class="notice">Admin key tidak disimpan di GitHub. Key hanya disimpan sementara di browser session.</div>
<form id="loginForm"><input id="adminKey" type="password" placeholder="Admin key" required><button class="btn" type="submit">Open database admin</button></form>
<p id="error" class="error small"></p></div>
<script src="js/config.js"></script><script src="js/login.js"></script></body></html>
